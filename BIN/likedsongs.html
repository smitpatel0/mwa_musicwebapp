    <script>
        function addLikedSong(event) {
            event.preventDefault();

            const songInput = document.getElementById('song-input');
            const songName = songInput.value.trim();

            if (songName) {
                fetch('../php/likedsongs.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `song_name=${encodeURIComponent(songName)}`
                })
                .then(response => response.text())
                .then(data => {
                    if (data === 'success') {
                        const likedSongsList = document.getElementById('liked-songs');
                        const newSong = document.createElement('li');
                        newSong.textContent = songName;
                        likedSongsList.appendChild(newSong);

                        songInput.value = '';
                    } else {
                        alert('Failed to add the song.');
                    }
                })
                .catch(error => console.error('Error:', error));
            }
        }
    </script>
