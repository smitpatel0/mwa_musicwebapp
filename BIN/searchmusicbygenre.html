<html>
<head>
    <title>Music Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        select, button {
            padding: 10px;
            margin: 10px 0;
            width: 100%;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        audio {
            width: 100%;
            margin-top: 20px;
        }
        .song-info {
            margin-top: 20px;
            text-align: center;
        }
        .song-info img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
        .song-info p {
            font-size: 18px;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Music Player</h1>
        <select id="genreDropdown">
            <option value="">Select Genre</option>
        </select>
        <select id="songDropdown" disabled>
            <option value="">Select Song</option>
        </select>
        <audio id="audioPlayer" controls>
            <source src="" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <div class="song-info" id="songInfo">
            <img id="songCover" src="" alt="Song Cover" style="display: none;">
            <p id="songArtist"></p>
        </div>
    </div>

    <script>
        // Fetch genres and populate the dropdown
        fetch('../php/getgenres.php')
            .then(response => response.json())
            .then(data => {
                const genreDropdown = document.getElementById('genreDropdown');
                if (data && Array.isArray(data)) {
                    data.forEach(genre => {
                        const option = document.createElement('option');
                        option.value = genre;
                        option.textContent = genre;
                        genreDropdown.appendChild(option);
                    });
                } else {
                    console.error('Error: Invalid genre data');
                }
            })
            .catch(error => console.error('Error fetching genres:', error));

        // Fetch songs based on selected genre
        document.getElementById('genreDropdown').addEventListener('change', function() {
    const genre = this.value;
    const songDropdown = document.getElementById('songDropdown');
    songDropdown.innerHTML = '<option value="">Select Song</option>'; // Reset the song dropdown
    
    if (!genre) {
        songDropdown.disabled = true; // Disable song dropdown if no genre selected
        return;
    }

    songDropdown.disabled = false; // Enable song dropdown

    // Fetch songs for the selected genre
    fetch(`../php/getsongs.php?genres=${genre}`)
        .then(response => {
            // Check if the response is ok (status 200-299)
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json(); // Parse the JSON response
        })
        .then(data => {
            if (Array.isArray(data) && data.length > 0) {
                data.forEach(song => {
                    const option = document.createElement('option');
                    option.value = song.playlist_audio; // Set audio file from playlists table
                    option.textContent = song.song_title; // Set song title from songs table
                    option.dataset.cover = song.playlist_cover; // Set cover image from playlists table
                    option.dataset.artist = song.song_artist; // Set artist name from songs table
                    songDropdown.appendChild(option);
                });
            } else {
                console.error('Error: No songs found for the selected genre');
                // Optionally show a message in the dropdown
                const noSongsOption = document.createElement('option');
                noSongsOption.textContent = 'No songs available for this genre';
                songDropdown.appendChild(noSongsOption);
            }
        })
        .catch(error => {
            console.error('Error fetching songs:', error);
            // Optionally show an error message in the dropdown
            const errorOption = document.createElement('option');
            errorOption.textContent = 'Failed to load songs';
            songDropdown.appendChild(errorOption);
        });
});


        // Display selected song's cover and artist, and play audio
        document.getElementById('songDropdown').addEventListener('change', function() {
            const audioPlayer = document.getElementById('audioPlayer');
            const songInfo = document.getElementById('songInfo');
            const songCover = document.getElementById('songCover');
            const songArtist = document.getElementById('songArtist');
            
            const selectedOption = this.options[this.selectedIndex];
            const songSrc = selectedOption.value;
            const coverSrc = selectedOption.dataset.cover;
            const artist = selectedOption.dataset.artist;
            
            console.log('Selected Song:', songSrc); // Log the song source URL

            // Set audio source
            audioPlayer.src = songSrc;
            
            // Play the audio
            audioPlayer.play()
                .catch(error => console.error('Error playing audio:', error));

            // Display song cover and artist
            if (coverSrc) {
                songCover.src = coverSrc;
                songCover.style.display = 'block';
            } else {
                songCover.style.display = 'none';
            }
            songArtist.textContent = artist || 'Unknown Artist';
        });
    </script>
</body>
</html>
