<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Settings</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #2d2d44;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #fff;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #fff;
        }
        input[type="text"],
        input[type="email"],
        input[type="number"],
        select {
            width: 95%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <h2>Payment Settings for Music Web Application</h2>
        <form id="paymentForm" action="../php/payments.php" method="POST">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <label for="cardNumber">Card Number:</label>
            <input type="number" id="cardNumber" name="cardNumber" required>

            <label for="expiryDate">Expiry Date (MM/YY):</label>
            <input type="text" id="expiryDate" name="expiryDate" required>

            <label for="subscriptionType">Subscription Type:</label>
            <select id="subscriptionType" name="subscriptionType" required>
                <option value="basic">Basic</option>
                <option value="premium">Premium</option>
                <option value="family">Family</option>
            </select>

            <label for="amount">Subscription Amount:</label>
            <select id="amount" name="amount" required>
                <option value="59">₹ 59/ 1 month</option>
                <option value="99">Rs.99/ 2 month</option>
                <option value="149">Rs.149/ 3 month</option>
                <option value="499">Rs.499/ 6 month</option>
                <option value="799">Rs.799/ 12 month</option>
            </select>

            <button type="submit">Submit Payment</button>
        </form>
    </div>
</body>
</html>
