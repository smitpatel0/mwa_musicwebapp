<!DOCTYPE html>
<html>
<head>
	<title>Add Albums</title>
	<style>
	body{
		font-family:Arial,sans-serif;
		margin:0;
		padding:0;
		background: #111;
		color:#333;
	}
	
	header{
		background-color:#111;
		color:white;
		text-align:center;
	}
	
	#head {
		top:0;
		position:sticky;
	}
	footer{
		background-color: #111;
		color: white;
		text-align: center;
		padding: 10px 0;
		margin-top: 20px;
	}
	
	.container{
		max-width: 1200px;
		margin: 20px auto;
		padding: 20px;
		color:#fff;
		background: linear-gradient(to bottom,blue,white);
		border-radius: 8px;
		box-shadow: 0 4px 6px rgba(0, 0, 0,0.1);
	}
	</style>
</head>
<body>
	<header>
	<h1 id="head">Add new album</h1>
	</header>
	<div class="container" id="add-album">
	<h2>Upload your album</h2>
	<form action="../php/albums.php" method="POST" enctype="multipart/form-data">
		<label for="album-title">Album Title</label><br>
		<input type="text" id="album-title" name="album-title" required><br><br>
		<label for="artist-name">Artist name:</label><br>
		<input type="text" id="artist-name" name="artist-name" required><br><br>
		<label for="genre">Genre</label><br>
		<input type="text" id="genre" name="genre" required><br><br>
		<label for="release-date">Release Date</label><br>
		<input type="text" id="release-date" name="release-date" required><br><br>
		<label for="album-cover">Album Cover:</label><br>
		<input type="file" id="album-cover" name="album-cover" accept="image/*" required><br><br>
		<label for="album-audio">Album Audio(MP3):</label><br>
		<input type="file" id="album-audio" name="album-audio" accept="audio/mpeg" required><br><br>
		<label for="description">Description</label><br>
		<textarea id="description" name="description" rows="4" required></textarea><br><br>
		<button type="Submit">Add Album</button><br><br>
		<a href="../php/albums.php?delete=1">Delete Album</a>

	</form>
	</div>
	<footer>
		<p>&copy; 2024 Music Web. All rights reserved</p>
	</footer>
</body>
</html>
