<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .logout-container {
            background-color: #2d2d44;
            padding: 20px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #fff;
        }
        p {
            color: #fff;
            margin: 20px 0;
        }
        .logout-button {
            background-color: #fff;
            color:black;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .logout-button:hover {
            background-color: #0056b3;
        }
		.logout-link{
			background: #2d2d44;
			color: #fff;
			text-decoration:underline;
			font-weight: bold;
			transition: color 0.3s ease;
		}

.logout-link:hover {
    color: #ff0000;
}
    </style>
</head>
<body>
    <div class="logout-container">
        <h1>You are logging out</h1>
        <p>Thank you for visiting.<br>
		Click below to return to the homepage.</p>
    
		<a href="../dashboard/main_dashboard.html" class="logout-link" onclick="redirectToHome()">Logout</a>
		<form id="logoutForm" method="POST" action="../php/logout.php" style="display: none;">
		<input type="hidden" name="action" value="logout">
		</form>
	</div>

    <script>
    function redirectToHome() {
        const confirmation = confirm("Are you sure you want to logout?");
		if (confirmation) {
		document.getElementById('logoutForm').submit();
        window.location.href = '../dashboard/main_dashboard.html';
		} 
		else 
		{
        // If the user cancels, do nothing
        console.log("Logout cancelled.");  // Optional: for debugging purposes
		}
    }
    </script>
</body>
</html>
