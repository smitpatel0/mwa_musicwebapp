        <!-- 🎵 Playlists Section -->
        <section class="playlist-section">

            <!-- 🎧 Global Music Player -->
            <div class="music-player">

                    <!-- The controls attribute gives us the basic player interface -->

                <div class="player-controls">
                    <button onclick="prevSong()">⏮️</button>
                    <!--<button onclick="togglePlayPause()">▶️/⏸️</button>-->
                    <button onclick="nextSong()">⏭️</button>

    <script>
        let songs = []; // ✅ Declare songs array
        let currentSongIndex = 0;
        let audioPlayer = document.getElementById("audio-player");
        let currentSongText = document.getElementById("current-song");

        // 🎵 Fetch playlists and populate songs
        fetch('../php/fetch_playlists.php')
            .then(response => response.json())
            .then(playlists => {
                console.log("Fetched Playlists:", playlists);
                const playlistsContainer = document.getElementById('playlists-container');

                playlists.forEach((playlist, index) => {
                    if (!playlist.playlist_name || !playlist.playlist_audio) {
                        console.warn(`Skipping playlist ${index}: Missing name or audio`);
                        return;
                    }

                     const playlistDiv = document.createElement('div');
                playlistDiv.className = 'playlist';

                const playlistImage = document.createElement('img');
                playlistImage.src = `../php/${playlist.playlist_cover}`;
                playlistImage.alt = `Cover for ${playlist.playlist_name}`;

                const playlistName = document.createElement('h3');
                playlistName.textContent = playlist.playlist_name;

                const playlistDescription = document.createElement('p');
                playlistDescription.textContent = playlist.description || "No description available.";

                const playButton = document.createElement('button');
                playButton.textContent = "▶️ Play";
                playButton.onclick = () => playSong(index);

                // 🎵 Like Button (Adds playlist to liked songs)
                const likeButton = document.createElement('button');
                likeButton.textContent = "♥";
                likeButton.classList.add("like-button");
                likeButton.onclick = () => likePlaylist(playlist.id, likeButton);

                playlistDiv.appendChild(playlistImage);
                playlistDiv.appendChild(playlistName);
                playlistDiv.appendChild(playlistDescription);
                playlistDiv.appendChild(playButton);
                playlistDiv.appendChild(likeButton);
                playlistsContainer.appendChild(playlistDiv);

                    // ✅ Push song details into the songs array
                    songs.push({
                        url: `../php/${playlist.playlist_audio}`,
                        name: playlist.playlist_name,
                        description: playlist.description
                    });

                    console.log(`Added song: ${playlist.playlist_name}, Description: ${playlist.description}, URL: ${songs[songs.length - 1].url}`);
                });

                if (songs.length === 0) {
                    console.error("No valid songs found!");
                }
            })
            .catch(error => console.error('Error fetching playlists:', error));

        // 🎵 Function to play a selected song
        function playSong(index) {
            if (index < 0 || index >= songs.length) return;

            currentSongIndex = index;
            audioPlayer.src = songs[index].url;
            audioPlayer.play();
            currentSongText.textContent = `Playing: ${songs[index].name}`;

            // Wait for audio to load
            audioPlayer.onloadedmetadata = () => {
                // Removed updateDuration and startUpdateCurrentTime functions
            };
        }

        // ⏯️ Toggle Play/Pause
        function togglePlayPause() {
            if (audioPlayer.paused) {
                audioPlayer.play();
            } else {
                audioPlayer.pause();
            }
        }

        // ⏭️ Play Next Song
        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % songs.length;
            playSong(currentSongIndex);
        }

        // ⏮️ Play Previous Song
        function prevSong() {
            currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
            playSong(currentSongIndex);
        }

        // 🔁 Toggle Loop
        function toggleLoop() {
            audioPlayer.loop = !audioPlayer.loop;
            alert(audioPlayer.loop ? "Loop Enabled" : "Loop Disabled");
        }
		
		// ♥ Like Playlist (Save to Database)
    function likePlaylist(playlistId, button) {
        fetch('../php/test3.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `playlist_id=${playlistId}`
        })
        .then(response => response.text())
        .then(result => {
            if (result.trim() === "success") {
                button.classList.toggle('liked');
                alert("Playlist added to Liked Songs!");
            } else {
                alert("Error adding playlist to Liked Songs.");
            }
        })
        .catch(error => console.error('Error liking playlist:', error));
    }
	
	document.querySelectorAll('.like-button').forEach(button => {
    button.addEventListener('click', function() {
        const songId = this.dataset.id;
        const playlistId = this.dataset.playlistId;
        
        // Send a POST request (optional, for backend insertion) or just redirect
        fetch('', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: `song_id=${songId}&playlist_id=${playlistId}`
        }).then(response => response.text()).then(data => {
            if (data === 'success') {
                // Redirect to test3.php with song_id as a URL parameter
                window.location.href = `test3.php?song_id=${songId}&playlist_id=${playlistId}`;
            } else {
                alert('An error occurred');
            }
        });
    });
});

   function confirmLogout() {
    const confirmation = confirm("Are you sure you want to logout?");
    if (confirmation) {
        // If the user confirms, submit the form to logout.php
        document.getElementById('logoutForm').submit();
    } else {
        // If the user cancels, do nothing
        console.log("Logout cancelled.");  // Optional: for debugging purposes
    }
}
